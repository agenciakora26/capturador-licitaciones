name: Automatizador Licitaciones PRO

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta automáticamente todos los días a las 08:00 AM UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions cuando quieras

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Ejecutar script de captura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scraper.py
