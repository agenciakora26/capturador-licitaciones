name: Capturar Licitaciones Diarias

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 8:00 UTC (9:00 en España)
  workflow_dispatch: # Permite darle al botón "Run workflow" manualmente cuando quieras

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/action-setup@v3 # O usa actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar script de licitaciones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node capturador-licitaciones.js
