name: Sincronizador Licitaciones PLACSP

on:
  workflow_dispatch:
  schedule:
      # Se ejecuta cada 2 horas de lunes a domingo
      - cron: "0 */2 * * *"

permissions:
  contents: read

concurrency:
  group: sincronizador-licitaciones
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar sincronizador de licitaciones
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TZ: Europe/Madrid
        run: |
          node sincronizar-licitaciones.js
